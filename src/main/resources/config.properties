# ---- Which site to run against -------------------------------------------------
# Change this one line (or run with -Denv=adactin) herokuapp to switch site.
env=saucedemo

# ---- Known environments: add as many as you like, as env.<name>.url ------------
env.herokuapp.url=https://the-internet.herokuapp.com
env.adactin.url=https://adactinhotelapp.com/HotelAppBuild/
env.saucedemo.url=https://www.saucedemo.com

# ---- Browser / run settings ----------------------------------------------------
browser=chrome
headless=false
explicit.wait.seconds=15
retry.count=0
# true = also attach a final screenshot to every passing test
screenshot.on.pass=true
